name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 允许 release.yml 通过 workflow_call 复用它作为发布门禁。
  workflow_call:

# 同一分支上的新 push 取消上一次仍在跑的 CI，避免重型任务排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快车道：几分钟内给出反馈，任何一项失败就不必再烧重型任务。
  fast:
    name: 快速检查（lint / typecheck / 单测）
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Worker 有独立的 vitest 配置和 node_modules，主仓的 test 不会收它。
      # 统计后台的授权判断就在这套测试里，必须一起跑。
      - name: Worker 单测
        working-directory: cloudflare/worker
        run: npm ci && npm test
      - name: Worker 类型检查
        working-directory: cloudflare/worker
        run: npx tsc -p tsconfig.json --noEmit
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  # 重车道：构建 + 原生模块 + 端到端，只在快车道通过后运行。
  heavy:
    name: 集成检查（build / sqlite / smoke / e2e）
    needs: fast
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "1"
      ELECTRON_DISABLE_GPU: "1"
      RECALL_OPEN_DEVTOOLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 数据维护/清理流程在真实 Electron 进程内跑通，依赖上面的 build:main。
      - run: npm run test:maintenance
      - run: npm run test:sqlite
      - run: npm run smoke:memory
      # playwright.config.ts 的 outputDir 已改为仓库内 test-results/，
      # 失败时仍上传产物（截图/trace），便于排查 CI 上的 e2e 失败。
      - run: npm run test:e2e
      - name: 上传 Playwright 测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
