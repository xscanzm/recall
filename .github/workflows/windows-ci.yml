name: Windows CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      ELECTRON_DISABLE_GPU: "1"
      RECALL_OPEN_DEVTOOLS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:sqlite
      - run: npm run smoke:memory
      - run: npm run test:e2e
