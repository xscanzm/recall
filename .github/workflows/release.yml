name: Release

# 触发条件：推送 v*.*.* 格式的 tag（如 v0.2.0、v1.0.3）
# 标准发布流程：本地改版本号 → git tag → git push --tags → Actions 自动构建+上传 R2
on:
  push:
    tags:
      - "v*.*.*"

# 防止并发发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 用于创建 GitHub Release

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python for RapidOCR worker
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            resources/ocr/requirements.txt
            resources/ocr/requirements-build.txt

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "filename=Recall-$version-setup.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Released version: $version"

      - name: Build & package NSIS installer
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "release/${{ steps.version.outputs.filename }}").Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "SHA256: $hash"

      - name: Generate manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_PATH: cloudflare/worker/release-notes.md
          OUTPUT_PATH: cloudflare/worker/manifest.release.json
        run: node scripts/generate-manifest.js

      - name: Upload installer to Cloudflare R2
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object put "recall-releases/${{ steps.version.outputs.filename }}" --file="../../release/${{ steps.version.outputs.filename }}"

      - name: Upload manifest.json to Cloudflare R2
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 object put "recall-releases/manifest.json" --file="manifest.release.json"

      - name: Verify deployment
        env:
          WORKER_URL: https://recall-update.ppclaw.online
        run: |
          Write-Host "Verifying deployment..."
          $response = Invoke-RestMethod -Uri "$env:WORKER_URL/api/latest" -UseBasicParsing
          Write-Host "Latest version on R2: $($response.version)"
          Write-Host "SHA256: $($response.sha256)"
          if ($response.version -ne "${{ steps.version.outputs.version }}") {
            Write-Host "ERROR: Version mismatch! Expected ${{ steps.version.outputs.version }}, got $($response.version)"
            exit 1
          }
          Write-Host "✓ Deployment verified"

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Recall-${{ steps.version.outputs.version }}-setup.exe
          body_path: cloudflare/worker/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
