name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 允许 release.yml 通过 workflow_call 复用它作为发布门禁。
  workflow_call:

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-check:
    name: macOS 完整构建与单元测试
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TZ: "Asia/Shanghai"
      ELECTRON_DISABLE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            resources/ocr/requirements.txt
            resources/ocr/requirements-build.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 与 Windows 快车道一致：强制覆盖率阈值，macOS 上同样把关。
      - run: npm run test:coverage
      # 与 Windows 快车道一致：Worker 有独立的 vitest 配置和 node_modules，
      # 主仓的 test 不会收它；统计后台的授权判断就在这套测试里，必须一起跑。
      - name: Worker 单测
        working-directory: cloudflare/worker
        run: npm ci && npm test
      - name: 构建 macOS 编译产物与包装
        run: |
          bash scripts/build-rapidocr-worker.sh
          npm run build
          npx electron-builder --mac --dir
