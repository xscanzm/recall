# Cloudflare Worker 配置：Recall 桌面端更新分发后端
# 详细文档见 README.md

name = "recall-update-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 自定义域名路由（国内可访问）
# 在 Cloudflare Dashboard 中已将 recall-update.ppclaw.online 绑定到此 Worker
routes = [
  { pattern = "recall-update.ppclaw.online/*", zone_name = "ppclaw.online" }
]

# ─────────────────────────────────────────────────────────────
# R2 存储桶绑定：保存 manifest.json 与安装包
# 创建存储桶：
#   npx wrangler r2 bucket create recall-releases
# ─────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "recall-releases"

# ─────────────────────────────────────────────────────────────
# KV 命名空间绑定：保存客户端版本检查统计
# 创建命名空间：
#   npx wrangler kv namespace create recall-stats
# 创建后把返回的 id 填到下方 id 字段
# ─────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "STATS"
id = "390817d3c39c4fc38e290fea1d9a6739"

[[d1_databases]]
binding = "MODEL_STATS"
database_name = "recall-model-stats"
database_id = "6c476704-1232-48d9-b692-2017e526ba71"
migrations_dir = "migrations"

# 默认多模态长任务：请求正文临时存入私有 R2，Queue 中只传随机作业 ID。
[[r2_buckets]]
binding = "MODEL_JOB_PAYLOADS"
bucket_name = "recall-model-job-payloads"

[[queues.producers]]
binding = "DEFAULT_MULTIMODAL_JOBS"
queue = "recall-default-multimodal-jobs"

[[queues.consumers]]
queue = "recall-default-multimodal-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 30
max_concurrency = 3

[triggers]
crons = ["*/15 * * * *"]

# 信息图能力的非敏感默认参数；密钥必须通过 `wrangler secret put INFOGRAPHIC_API_KEY` 注入。
[vars]
INFOGRAPHIC_API_URL = "https://api.ppclaw.online/v1/images/generations"
INFOGRAPHIC_MODEL = "sensenova-u1-fast"
INFOGRAPHIC_SIZE = "2752x1536"
DEFAULT_LANGUAGE_API_URL = "https://api.ppclaw.online"
DEFAULT_LANGUAGE_MODEL = "deepseek-v4-flash"
DEFAULT_MULTIMODAL_API_URL = "https://api.ppclaw.online"
DEFAULT_MULTIMODAL_MODEL = "sensenova-6.7-flash-lite"
MODEL_PROXY_ENABLED = "true"
